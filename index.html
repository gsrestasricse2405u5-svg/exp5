<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
    <script src="validation.js"></script>
</head>

<body>
<div class="container">
<center>
<h1>Registration Form</h1>

<form name="reg" onsubmit="return validateForm()">
<table>

<tr>
<td>First name</td>
<td><input type="text" name="fname"></td>
</tr>

<tr>
<td>Last name</td>
<td><input type="text" name="lname"></td>
</tr>

<tr>
<td>Phone number</td>
<td><input type="text" name="ph"></td>
</tr>

<tr>
<td>Email</td>
<td><input type="text" name="em"></td>
</tr>

<tr>
<td>Father's name</td>
<td><input type="text" name="fname"></td>
</tr>

<tr>
<td>Father's phone number</td>
<td><input type="text" name="fophno"></td>
</tr>
   

<tr>
<td>Mother's name</td>
<td><input type="text" name="moname"></td>
</tr>

<tr>
<td>DOB</td>
<td><input type="text" name="dob" placeholder="dd/mm/yyyy"></td>
</tr>

<tr>
<td>Gender</td>
<td>
<input type="radio" name="gender" value="male">Male
<input type="radio" name="gender" value="female">Female
</td>
</tr>

<tr>
<td>Photo</td>
<td><input type="file" name="photo"></td>
</tr>

<tr>
<td>Signature</td>
<td><input type="file" name="sgn"></td>
</tr>

<tr>
<td></td>
<td>
<input type="submit" value="Submit">
<input type="reset" value="Reset">
</td>
</tr>

</table>
</form>
</center>
</div>
</body>
</html>
